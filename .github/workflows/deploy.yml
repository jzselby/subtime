name: Build and deploy

# Publishes the built PWA so it can be installed on a phone. GitHub Pages serves
# over HTTPS, which iOS requires before it will install a web app or run its
# service worker — a plain LAN address will load the page but not install it.
#
# Every branch is built and tested; only the default branch is published. That
# split is not a preference, it is the constraint: enabling Pages creates a
# `github-pages` environment whose deployment branch policy allows the default
# branch alone, so a deploy from anywhere else is rejected before a runner is
# even assigned — a red job with no logs to explain itself. Building everywhere
# still gets feature branches their CI.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Turning Pages on for the first time is a one-time manual step:
      # Settings → Pages → Source: GitHub Actions. It cannot be automated here.
      # `enablement: true` looks like it would do it, but creating a Pages site
      # needs repo admin and GITHUB_TOKEN tops out at write, so it fails with
      # "Resource not accessible by integration". `pages: write` below is enough
      # to *deploy* to a site that already exists, which is all this needs.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    # Reads the default branch at run time, so renaming it to `main`
    # (Settings → Branches) needs no change here.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
