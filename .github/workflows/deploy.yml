name: Deploy to GitHub Pages

# Publishes the built PWA so it can be installed on a phone. GitHub Pages serves
# over HTTPS, which iOS requires before it will install a web app or run its
# service worker — a plain LAN address will load the page but not install it.
on:
  push:
    branches: [main, claude/soccer-team-stats-app-ct2rr1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # app first, so its PWA service-worker precache manifest (built from
      # app/dist's contents at build time) doesn't pick up dashboard/'s
      # files — they're copied in below, after this build finishes.
      - run: npm run build
      - run: npm run build:dashboard
      - run: cp -r dashboard/dist app/dist/dashboard
      # Turning Pages on for the first time is a one-time manual step:
      # Settings → Pages → Source: GitHub Actions. It cannot be automated here.
      # `enablement: true` looks like it would do it, but creating a Pages site
      # needs repo admin and GITHUB_TOKEN tops out at write, so it fails with
      # "Resource not accessible by integration". `pages: write` below is enough
      # to *deploy* to a site that already exists, which is all this needs.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
